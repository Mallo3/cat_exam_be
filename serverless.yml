service: cat-exam-native-api
useDotenv: true

provider:
  name: aws
  runtime: nodejs18.x
  region: ap-south-1
  environment:
    MONGODB_URI: ${env:MONGODB_URI}
    API_SECRET: ${env:API_SECRET}
  httpApi:
    cors: true # API Gateway v2 handles CORS automatically here

plugins:
  - serverless-offline

functions:
  api:
    handler: index.handler
    events:
      # This catches everything and sends it to your vanilla JS router
      - httpApi: '*'